name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-core-wheels:
    name: Build core wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheels (maturin)
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
          manylinux: auto

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-core-${{ matrix.os }}
          path: dist/*.whl

  build-sdk:
    name: Build SDK wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install build

      - name: Build SDK wheel
        run: python -m build ./python --outdir dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdk
          path: dist/*.whl

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-core-wheels, build-sdk]
    environment: release
    permissions:
      id-token: write  # for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
