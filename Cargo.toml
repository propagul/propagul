[package]
name = "entropy-state"
version = "0.1.0"
edition = "2021"
description = "Crash-resilient state synchronization for multi-agent AI systems"
license = "Proprietary"

[lib]
name = "entropy_state_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true        # Strip symbols — IP protection
codegen-units = 1
panic = "abort"     # No unwind tables — smaller binary, less info leak
